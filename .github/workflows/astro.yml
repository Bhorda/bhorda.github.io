name: Deploy Astro site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_PATH: "."

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: ${{ env.BUILD_PATH }}/package-lock.json
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.BUILD_PATH }}
      - name: Install Linux native binaries
        # The lockfile is generated on macOS, so it resolves only the darwin
        # builds of the three packages that ship native binaries. Install the
        # Linux ones here, pinned to the versions npm ci resolves, with
        # --no-save so the lockfile stays the single source of truth.
        # Without sharp, `astro build` fails at image optimization.
        run: |
          npm install --no-save \
            @img/sharp-linux-x64@0.33.5 \
            @rollup/rollup-linux-x64-gnu@4.24.0 \
            @esbuild/linux-x64@0.21.5
        working-directory: ${{ env.BUILD_PATH }}
      - name: Build with Astro
        run: |
          npm run build -- --site "${{ steps.pages.outputs.origin }}" --base "${{ steps.pages.outputs.base_path }}"
        working-directory: ${{ env.BUILD_PATH }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
