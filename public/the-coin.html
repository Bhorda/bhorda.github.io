<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,800;0,900;1,800&display=swap">
<style>
/* Layout: one sticky stage. Upper part is a hand-drawn sketch, lower part is a text reel that scrolls lines up like a teleprompter. Scroll position drives everything. Paper/ink swap between white and black as the poem moves inward and out. */
:root{
  --paper:#ffffff; --ink:#0b0b0b; --faint:#9a9a9a; --red:#d8261b;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --size: clamp(1.5rem, 5.6vw, 4rem);
  color-scheme: light;
}
:root.night{ --paper:#0b0b0b; --ink:#f3f3f3; --faint:#6f6f6f; color-scheme: dark; }
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--display);margin:0}
.track{height:calc(100svh + 147 * 62svh)}
.stage{position:sticky;top:0;height:100svh;display:grid;grid-template-rows:56% 44%;overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.sketch{display:flex;align-items:flex-end;justify-content:center;min-height:0;color:var(--ink)}
.sketch svg{height:100%;max-width:100%;transform-origin:50% 78%;overflow:visible}
.occ{fill:var(--paper)}
.boil{filter:url(#boilT)}
.reel{position:relative;min-width:0}
.line{position:absolute;left:0;right:0;top:28%;text-align:center;font-weight:900;font-size:var(--size);
  line-height:1.1;letter-spacing:-0.02em;text-wrap:balance;will-change:transform,opacity}
.line .w{display:inline-block;will-change:transform,opacity}
.line.big{font-size:clamp(5rem, 24vw, 15rem);letter-spacing:-0.05em;top:-8%}
.line.quote{font-style:italic;font-weight:800}
.line.voice{color:var(--red)}
.line.small{font-size:calc(var(--size) * .62);color:var(--faint);font-weight:800}
.line.heavy{font-size:calc(var(--size) * 1.6);letter-spacing:-0.04em}
#receipt{position:absolute;left:50%;top:0;width:min(340px, 80vw);background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);padding:14px 20px 26px;font-weight:800;font-size:clamp(1.1rem, 4.6vw, 1.6rem);
  line-height:1.15;opacity:0;z-index:2;box-sizing:border-box}
#receipt .row{padding:10px 0;border-bottom:2px dashed var(--ink)}
#receipt .row:last-child{border-bottom:0}
#gs{position:fixed;left:0;right:0;top:50%;text-align:center;font-weight:900;font-size:clamp(2.2rem, 9vw, 6rem);
  letter-spacing:-0.03em;line-height:1;color:#0b0b0b;opacity:0;transform-origin:50% 100%;z-index:5;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
#wipe{position:fixed;inset:0;background:#0b0b0b;transform:translateY(100%);z-index:4}
.hint,.end{position:fixed;left:0;right:0;text-align:center;font-weight:500;font-size:.8rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:6}
.end{opacity:0}
@media (prefers-reduced-motion: reduce){ .boil, .sketch g[filter]{filter:none} }
</style>
</head>

  let rnd = 7; const rand = () => (rnd = (rnd * 16807) % 2147483647) / 2147483647;

  // ---- The score: every line, the step(s) it lands on, and how it moves ----

    });

    // x-ray fingers furl round the coin, then let go as it rises
    const curl = show(s, 53.9, 54.6, 58.2, 58.6);
    fCurl.setAttribute('opacity', curl); fOpen.setAttribute('opacity', 1 - curl);

    // the walk: scrolling is walking; trees slide past until "Hey"
    const walkS = clamp(s, 70.4, 76.6);
    const walking = s > 70.4 && s < 76.6;
    const step = Math.floor(walkS * 5) % 2;
    walkA.style.opacity = walking && step ? 0 : 1; walkB.style.opacity = walking && step ? 1 : 0;
    walker.setAttribute('transform', `translate(${lerp(110, 210, ease((s - 70.4) / 6.2))} 0)`);
    const off = (walkS - 70.4) * 95;
    trees.forEach(t => { const x = ((t.bx - off) % 650 + 650) % 650 - 80; t.g.setAttribute('transform', `translate(${x} 0)`); });

    // the spotlight: on, dims while the coin decides, back on, then a cage that breaks apart
    spot.style.opacity = show(s, 94.6, 95.4, 134.9, 135.5) * (1 - 0.65 * show(s, 125.2, 125.8, 132.2, 132.8));
    darkPeople.forEach(p => p.g.setAttribute('opacity', 0.5 * show(s, p.many ? 98.0 : 97.7, p.many ? 98.6 : 98.2, 109.6, 110.4)));
    const mir = show(s, 106.4, 107.0, 109.4, 110.0);
    me.setAttribute('transform', `translate(${-38 * mir} 0)`);
    reflection.setAttribute('opacity', 0.55 * mir);
    reflection.setAttribute('transform', `translate(${38 * mir} 0)`);
    mirrorLine.setAttribute('opacity', mir);
    const breakT = ease((s - 134.6) / 0.8);
    bars.forEach(b => {
      b.p.style.strokeDashoffset = 1 - ease((s - 133.8 - b.i * 0.05) / 0.5);
      b.p.setAttribute('transform', `translate(${b.dx * breakT} ${breakT * breakT * 420}) rotate(${b.rot * breakT} ${140 + b.i * 15} 200)`);
    });
    cageTop.style.strokeDashoffset = 1 - ease((s - 134.0) / 0.4);
    cageTop.setAttribute('opacity', 1 - breakT);

    // a pile of coins, one at a time
    const nCoins = Math.floor(clamp((s - 145.0) * 3.4, 0, pileCoins.length));
    const pileOp = 1 - ease((s - 150.2) / 0.6);
    pileCoins.forEach((g, i) => g.setAttribute('opacity', i < nCoins ? pileOp : 0));

    // the last coin shatters
    const sh = ease((s - 155.9) / 1.4);
    shards.forEach(p => {
      p.g.setAttribute('opacity', shattered ? 1 - ease((s - 156.8) / 0.6) : 0);
      p.g.setAttribute('transform', `translate(${cx + p.dx * p.dist * sh} ${cy + p.dy * p.dist * sh + sh * sh * 120}) rotate(${p.rot * sh}) scale(${sc})`);
    });

    // the sketch steps back on "Back.", and leans in on "Surely, you get it?"
    const back = show(s, 9.2, 10.4, 10.5, 11.2), zoom = show(s, 120.8, 121.8, 124.8, 125.5);
    art.style.transform = `scale(${lerp(1, 0.86, back) * (1 + 0.75 * zoom)})`;

    hint.style.opacity = 1 - ease(s / 0.3);
    end.style.opacity = ease((s - END) / 0.4);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // line "boil": sketches and words wobble like hand-drawn animation
  if (!reduce) {
    const turbs = document.querySelectorAll('.turb');
    let seed = 1;
    setInterval(() => { seed = (seed % 4) + 1; turbs.forEach(t => t.setAttribute('seed', seed)); }, 160);
  }
})();
</script>
